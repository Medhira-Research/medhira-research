name: Python Learning CI

on:
  push:
    branches: [main]
    paths:
      - "learning/python-zero/**"
      - ".github/workflows/python-learning.yml"
  pull_request:
    paths:
      - "learning/python-zero/**"
      - ".github/workflows/python-learning.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run beginner project tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learning/python-zero
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: learning/python-zero/requirements-dev.txt

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run automated tests
        run: python -m pytest -q
